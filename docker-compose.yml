services:
  fotos:
    build: .
    container_name: fotos
    restart: unless-stopped
    ports:
      # Porta no servidor: mude FOTOS_PORT (ou o número abaixo) se 8085 também estiver ocupada.
      - "${FOTOS_PORT:-8085}:8080"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - ./data:/data
    # Limita a app para não travar o resto do servidor.
    mem_limit: 512m
    cpus: 1.5
